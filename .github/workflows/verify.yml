name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Source and unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
  media:
    name: Media and package (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.14.0'
          cache: npm
      - uses: browser-actions/setup-chrome@48483d551c22a1fe6154c6a195ccc6d5773dc8c4 # v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Allow the CI Chrome binary to use its namespace sandbox
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          # Ubuntu restricts user namespaces for downloaded Chrome builds.
          # Allow only this runner's exact executable; keep Chrome's sandbox
          # and the host-wide AppArmor restriction enabled. No app launch flags change.
          chrome_binary="$(realpath "$CHROME_PATH")"
          test -x "$chrome_binary"
          sudo tee /etc/apparmor.d/agent-motion-studio-ci-chrome > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile agent-motion-studio-ci-chrome "$chrome_binary" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/agent-motion-studio-ci-chrome
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg zip
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run doctor
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Verify Chrome namespace and seccomp sandboxes
        run: node .github/scripts/check-chrome-sandbox.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:integration
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run release:prepare
      - run: npm run verify:package
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: candidate-and-package-check
          path: |
            artifacts/release/
            !artifacts/release/**/staging/**
          retention-days: 7
